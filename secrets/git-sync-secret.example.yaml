# Example only. Copy to git-sync-secret.yaml (git-ignored), fill in, then apply as an admin.
# Referenced from a vulcan manifest as `repo.secretId: <tenant>:<name>`.
# The vulcan stack runs git-sync (image tmdcio/git-sync 4.7.2) with this secret injected as
# environment variables, so the data keys are git-sync's own v4 variable names.
name: <git-sync secret name>
version: v2alpha
type: secret
tags:
  - git-sync
description: Credentials git-sync uses to clone the repo
tenant: ${DATAOS_TENANT}
spec:
  type: key-value
  data:
    GITSYNC_USERNAME: <git username>
    GITSYNC_PASSWORD: <git app password or access token>
