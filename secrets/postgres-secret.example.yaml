# Example only. Copy to postgres-secret.yaml (git-ignored), fill in, then apply as an admin.
# A depot references this as `secrets: [{id: <tenant>:<name>, purpose: scan|query|rw}]`,
# so <name> must equal the id the depot lists.
name: <postgres secret name>
version: v2alpha
type: secret
tags:
  - postgresql
description: Postgres credentials for a depot
tenant: ${DATAOS_TENANT}
spec:
  type: key-value
  data:
    username: <postgres user>
    password: <postgres password>
