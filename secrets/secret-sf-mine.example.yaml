# Example only. Copy to secret-sf-mine.yaml (git-ignored), fill in, then apply as an admin.
# A Snowflake depot references this as `secrets: [{id: <tenant>:<name>, purpose: query|rw|scan}]`,
# so <name> must equal the id the depot lists.
# Key-pair auth. Never commit a real private key, and never paste one into chat or logs.
name: <snowflake secret name>
version: v2alpha
type: secret
tags:
  - snowflake
description: Snowflake key-pair credentials for a depot
tenant: ${DATAOS_TENANT}
spec:
  type: key-value
  data:
    username: <SNOWFLAKE_USER>
    auth_mode: key-pair
    key: |
      -----BEGIN PRIVATE KEY-----
      <paste the PKCS8 private key here, one base64 line per line>
      -----END PRIVATE KEY-----
